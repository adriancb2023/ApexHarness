<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ApexHarness</title></head>
<body>
  <h1>ApexHarness</h1>
  <select id="project-selector"></select>
  <ul id="session-list"></ul>
  <div id="task-status" data-state="idle">idle</div>
  <div id="chat-log"></div>
  <input id="chat-input" placeholder="habla con opencode">
  <button id="chat-send">enviar</button>
  <h2>Kanban</h2>
  <div id="kanban-board">
    <div data-col="backlog"><h3>Backlog</h3><ul></ul></div>
    <div data-col="progreso"><h3>En Progreso</h3><ul></ul></div>
    <div data-col="pruebas"><h3>Pruebas</h3><ul></ul></div>
    <div data-col="listo"><h3>Listo</h3><ul></ul></div>
  </div>
  <ul id="kanban-edges"></ul>
  <script>
    let ws = null, sid = null;
    const log = document.getElementById('chat-log');
    const status = document.getElementById('task-status');
    function setStatus(s) { status.dataset.state = s; status.textContent = s; }
    async function openChat(sessionId) {
      sid = sessionId;
      if (ws) ws.close();
      setStatus('working');
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/sessions/' + sid);
      ws.onmessage = (ev) => {
        const m = JSON.parse(ev.data);
        if (m.delta) log.innerHTML += `<span>${m.delta}</span>`;
        if (m.done) setStatus(m.status === 'done' ? 'done' : 'needs_approval');
      };
      ws.onclose = () => { if (status.dataset.state === 'working') setStatus('done'); };
    }
    document.getElementById('chat-send').onclick = () => {
      const inp = document.getElementById('chat-input');
      setStatus('working');
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({content: inp.value}));
      inp.value = '';
    };
    async function refreshKanban(pid) {
      const cards = await (await fetch('/api/cards?project_id=' + pid)).json();
      for (const col of document.querySelectorAll('#kanban-board [data-col]')) {
        const ul = col.querySelector('ul');
        ul.innerHTML = cards.filter(k => k.status === col.dataset.col)
          .map(k => `<li data-card="${k.id}" data-blocked="${k.blocked}">${k.title}${k.blocked ? ' ⛔' : ''}</li>`).join('');
      }
      document.getElementById('kanban-edges').innerHTML = cards.flatMap(k => k.depends_on.map(d => `<li data-edge="${d}-&gt;${k.id}">${d} -&gt; ${k.id}</li>`)).join('');
    }
  </script>
</body>
</html>
